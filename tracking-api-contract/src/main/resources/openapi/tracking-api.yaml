openapi: 3.1.0
info:
  title: Tracking Service API
  description: Контракт API сервиса управления местонахождением волонтёров.
  version: 0.0.1
servers:
  - url: http://localhost:8080
tags:
  - name: Tracking
    description: API отслеживания местонахождения волонтёров
paths:
  /api/v1/tracking:
    post:
      tags:
        - Tracking
      operationId: saveVolunteerLocation
      summary: Передача текущего местонахождения волонтёра
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolunteerLocationRequest'
      responses:
        '204':
          description: Местонахождение волонтёра сохранено
        '400':
          description: Некорректный запрос
  /api/v1/tracking/rectangle:
    post:
      tags:
        - Tracking
      operationId: getVolunteerLocationsInRectangle
      summary: Получение местонахождения волонтёров в пределах прямоугольника
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrackingRectangleRequest'
      responses:
        '200':
          description: Идентификаторы и координаты волонтёров в указанном прямоугольнике
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VolunteerLocationDto'
        '400':
          description: Некорректный запрос
  /api/v1/tracking/volunteer/{id}:
    get:
      tags:
        - Tracking
      operationId: getVolunteerLocation
      summary: Получение текущих координат волонтёра по идентификатору
      parameters:
        - name: id
          in: path
          required: true
          description: Идентификатор волонтёра
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Текущие координаты волонтёра
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolunteerLocationDto'
        '400':
          description: Некорректный идентификатор волонтёра
        '404':
          description: Местонахождение волонтёра не найдено
  /api/v1/tracking/nearest:
    post:
      tags:
        - Tracking
      operationId: getNearestVolunteerLocations
      summary: Получение ближайших к указанной координате волонтёров
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NearestVolunteerLocationsRequest'
      responses:
        '200':
          description: Идентификаторы и координаты ближайших волонтёров
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VolunteerLocationDto'
        '400':
          description: Некорректный запрос
  /api/v1/tracking/volunteer/list:
    post:
      tags:
        - Tracking
      operationId: getVolunteerLocationsByIds
      summary: Получение текущих координат волонтёров по списку идентификаторов
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VolunteerLocationListRequest'
      responses:
        '200':
          description: Идентификаторы волонтёров и их координаты при наличии
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VolunteerLocationDto'
        '400':
          description: Некорректный запрос
components:
  schemas:
    VolunteerLocationRequest:
      type: object
      description: Текущие координаты волонтёра
      required:
        - volunteerId
        - lat
        - lon
      properties:
        volunteerId:
          type: string
          format: uuid
          description: Идентификатор волонтёра
        lat:
          $ref: '#/components/schemas/Latitude'
        lon:
          $ref: '#/components/schemas/Longitude'
    TrackingRectangleRequest:
      type: object
      description: Координаты левой верхней и правой нижней границ прямоугольника
      required:
        - lat_1
        - lon_1
        - lat_2
        - lon_2
      properties:
        lat_1:
          $ref: '#/components/schemas/Latitude'
          description: Широта левой верхней границы прямоугольника
        lon_1:
          $ref: '#/components/schemas/Longitude'
          description: Долгота левой верхней границы прямоугольника
        lat_2:
          $ref: '#/components/schemas/Latitude'
          description: Широта правой нижней границы прямоугольника
        lon_2:
          $ref: '#/components/schemas/Longitude'
          description: Долгота правой нижней границы прямоугольника
    NearestVolunteerLocationsRequest:
      type: object
      description: Координаты для поиска и количество ближайших волонтёров
      required:
        - number
        - lat
        - lon
      properties:
        number:
          type: integer
          format: int32
          minimum: 1
          description: Количество ближайших волонтёров для поиска
        lat:
          $ref: '#/components/schemas/Latitude'
        lon:
          $ref: '#/components/schemas/Longitude'
    VolunteerLocationListRequest:
      type: object
      description: Список идентификаторов волонтёров для поиска текущих координат
      required:
        - volunteerIds
      properties:
        volunteerIds:
          type: array
          minItems: 1
          items:
            type: string
            format: uuid
          description: Идентификаторы волонтёров
    VolunteerLocationDto:
      type: object
      description: Текущее местонахождение волонтёра; координаты отсутствуют, если они не найдены
      required:
        - volunteerId
      properties:
        volunteerId:
          type: string
          format: uuid
          description: Идентификатор волонтёра
        lat:
          $ref: '#/components/schemas/Latitude'
        lon:
          $ref: '#/components/schemas/Longitude'
    Latitude:
      $ref: 'common.yaml#/components/schemas/Latitude'
    Longitude:
      $ref: 'common.yaml#/components/schemas/Longitude'
